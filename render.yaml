# Render "Blueprint": describes the service so it can be created in a few clicks.
# Secrets are never stored here. Render asks you for them when you create the service.
services:
  - type: web
    name: product-roadmap
    runtime: docker
    # "free" instances go to sleep when idle and wake slowly. Change to a paid plan if that is a problem.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The host sits in front of the app and handles HTTPS.
      - key: TRUST_PROXY
        value: "1"
      # Choose a long password (12+ characters). Anyone who has it can see the roadmap.
      - key: ACCESS_PASSWORD
        sync: false
      # Signs the "you are signed in" cookie. Generated for you.
      - key: SESSION_SECRET
        generateValue: true
      # Fill in the group for the tool you use and leave the other blank.
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: ADO_ORG_URL
        sync: false
      - key: ADO_PROJECT
        sync: false
      - key: ADO_PAT
        sync: false
